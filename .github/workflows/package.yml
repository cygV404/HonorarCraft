name: Build Desktop Apps

# Automatischer Build bei Push ist waehrend des KMP-Umbaus abgeschaltet
# (siehe KMP_PLAN.md). Der Workflow laeuft nur noch manuell ueber
# "Actions -> Build Desktop Apps -> Run workflow".
# Zum Reaktivieren die folgenden drei Zeilen wieder einkommentieren.
on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:

        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: runner.os != 'Windows'

      - name: Build MSI or DMG

        run: ./gradlew packageDistributionForCurrentOS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HonorarCraft-${{ matrix.os }}
          path: composeApp/build/compose/binaries/main/